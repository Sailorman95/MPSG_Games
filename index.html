const lg=g=>(S.fx[g]||[]).filter(f=>f.b&&!f.k),ko=g=>(S.fx[g]||[]).filter(f=>f.k);

const win=f=>f.sa>f.sb?f.a:f.sa<f.sb?f.b:f.w==='a'?f.a:f.w==='b'?f.b:null;
const stg=f=>({sf1:'Semi-final 1',sf2:'Semi-final 2','3p':'Third place',f:'Final'}[f.k]||'Round '+f.r);

function slotsIn(){const t=tlist().length,o=oset();let c=0;const d=new Date(S.start+'T12:00'),e=new Date(S.end+'T12:00');for(;d<=e;d.setDate(d.getDate()+1))if(d.getDay()%6&&!o.has(dkey(d)))c+=t;return c}
function table(g){const m={},R=S.teams.map(t=>m[t.id]={t,P:0,W:0,D:0,L:0,F:0,A:0});
 lg(g).filter(f=>f.done&&m[f.a]&&m[f.b]).forEach(f=>{const a=m[f.a],b=m[f.b];a.P++;b.P++;a.F+=f.sa;a.A+=f.sb;b.F+=f.sb;b.A+=f.sa;
  if(f.sa>f.sb){a.W++;b.L++}else if(f.sa<f.sb){b.W++;a.L++}else{a.D++;b.D++}});
 R.forEach(r=>{r.Pts=r.W*S.win+r.D*S.draw;r.GD=r.F-r.A;r.tb=+(S.tb||{})[g+'|'+r.t.id]||0});
 R.sort((x,y)=>y.Pts-x.Pts||y.GD-x.GD||y.F-x.F||y.tb-x.tb||x.t.name.localeCompare(y.t.name));
 const same=(a,b)=>a&&b&&a.Pts===b.Pts&&a.GD===b.GD&&a.F===b.F&&a.tb===b.tb;R.forEach((r,i)=>r.tie=same(r,R[i+1])||same(r,R[i-1]));return R}

function finished(g){if(!leagueDone(g))return false;if(!hasKO())return true;const K=ko(g),f=K.find(x=>x.k==='f'),p=K.find(x=>x.k==='3p');return !!(f&&p&&f.done&&p.done)}
function order(g){const t=table(g).map(r=>r.t.id);if(!hasKO())return t;const K=ko(g),f=K.find(x=>x.k==='f'),p=K.find(x=>x.k==='3p'),o=x=>win(x)===x.a?x.b:x.a;const top=[win(f),o(f),win(p),o(p)];return[...top,...t.filter(x=>!top.includes(x))]}
function adv(g){const F=S.fx[g]||[],q=k=>F.find(x=>x.k===k),s1=q('sf1'),s2=q('sf2'),f=q('f'),p=q('3p');if(!s1||!s2)return;
 const w=x=>x.done?win(x):null,l=x=>{const v=w(x);return v?(v===x.a?x.b:x.a):null};f.a=w(s1);f.b=w(s2);p.a=l(s1);p.b=l(s2)}
function board(){const R={};S.teams.forEach(t=>R[t.id]={t,pts:0,m:[0,0,0]});let fin=0;
 act().forEach(g=>{if(!finished(g.id))return;fin++;order(g.id).forEach((id,i)=>{if(R[id]){R[id].pts+=S.pts[Math.min(i,4)];if(i<3)R[id].m[i]++}})});
 const L=Object.values(R).sort((x,y)=>y.pts-x.pts||y.m[0]-x.m[0]||y.m[1]-x.m[1]||y.m[2]-x.m[2]);return{L,fin,tot:act().length}}
function rr(ids,legs){const t=[...ids];if(t.length%2)t.push(null);const m=t.length,o=[];
 for(let l=0;l<legs;l++)for(let r=0;r<m-1;r++)for(let k=0;k<m/2;k++){
  const a=k?(r+k)%(m-1):m-1,b=k?(r-k+m-1)%(m-1):r;let x=t[a],y=t[b];if(l%2)[x,y]=[y,x];
  const rd=r+1+l*(m-1);o.push(x===null||y===null?{id:uid(),r:rd,a:x??y,b:null,sa:0,sb:0,done:true}:{id:uid(),r:rd,a:x,b:y,sa:0,sb:0,done:false})}

 return reg()+c+`<div class="cd tw"><h2>Overall leaderboard</h2><table><tr><th>#</th><th>Team</th><th>Points</th><th>1st</th><th>2nd</th><th>3rd</th></tr>${L.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.t.name)}</b></td><td><b>${r.pts}</b></td><td>${r.m[0]}</td><td>${r.m[1]}</td><td>${r.m[2]}</td></tr>`).join('')||'<tr><td colspan=6 class="mu">No teams yet.</td></tr>'}</table></div>`}

function vFix(){let L=[];Object.keys(S.fx).forEach(g=>{if((!fg||fg===g)&&S.games.some(x=>x.id===g&&x.on))S.fx[g].forEach(f=>L.push({...f,g}))});
 L=L.filter(x=>(!tsel||x.a===tsel||x.b===tsel)&&(tsel||x.b||x.k)).sort((x,y)=>(x.d||'9').localeCompare(y.d||'9')||(x.tm||'').localeCompare(y.tm||'')||x.r-y.r);

function vSt(){const g=gamesSel(),T=table(g),K=ko(g);

 ${finished(g)?`<div class="cd"><b>Final order:</b> ${order(g).slice(0,4).map((id,i)=>(i+1)+'. '+esc(tn(id))).join(' &nbsp; ')}</div>`:''}`}

  const ss=[],mr=Math.max(...gs.map(g=>Math.max(...lg(g.id).map(f=>f.r)))),par=Math.max(1,+S.par||1),o=oset();
  for(let r=1;r<=mr;r++)gs.forEach(g=>{if(lg(g.id).some(f=>f.r===r))ss.push({g:g.id,r})});
  if(hasKO()){gs.forEach(g=>ss.push({g:g.id,k:'sf'}));gs.forEach(g=>ss.push({g:g.id,k:'fin'}))}
  const sl=[],d=new Date(S.start+'T12:00');while(sl.length*par<ss.length&&sl.length<3000){if(d.getDay()%6&&!o.has(dkey(d)))ts.forEach(t=>sl.push([dkey(d),t]));d.setDate(d.getDate()+1)}
  S.ko={};ss.forEach((x,i)=>{const[dy,tm]=sl[Math.floor(i/par)];if(x.k)(S.ko[x.g]=S.ko[x.g]||{})[x.k]=[dy,tm];else(S.fx[x.g]||[]).filter(f=>!f.k&&f.r===x.r).forEach(f=>{f.d=dy;f.tm=tm})});
  Object.keys(S.ko).forEach(g=>ko(g).forEach(f=>{const p=S.ko[g][f.k==='sf1'||f.k==='sf2'?'sf':'fin'];if(p){f.d=p[0];f.tm=p[1]}}));
  const last=sl[Math.floor((ss.length-1)/par)][0];S.note=ss.length+' sessions planned up to '+last+(last>S.end?' (AFTER your end date: add times per day or games at once, then Re-plan)':' (fits inside your dates)');toast('Dates planned');save()},
 genko(){let n=0,msg='';act().forEach(g=>{const F=S.fx[g.id]||[];if(!leagueDone(g.id)||ko(g.id).length)return;const T=table(g.id),a=T[3],b=T[4];
  if(a&&b&&a.Pts===b.Pts&&a.GD===b.GD&&a.F===b.F&&a.tb===b.tb){msg=g.name+': teams are level for 4th place. Set a tie-break number on the Standings tab.';return}
  const p=(S.ko||{})[g.id]||{},mk=(k,r,x,y,dt)=>({id:uid(),k,r,a:x,b:y,sa:0,sb:0,done:false,w:'',d:dt?dt[0]:'',tm:dt?dt[1]:''});
  F.push(mk('sf1',101,T[0].t.id,T[3].t.id,p.sf),mk('sf2',102,T[1].t.id,T[2].t.id,p.sf),mk('3p',103,null,null,p.fin),mk('f',104,null,null,p.fin));S.fx[g.id]=F;n++});
  toast(msg||n+' knockout stage(s) created');save()},
 pts(){S.pts=[0,1,2,3,4].map(i=>+$('#p'+i).value||0);S.win=+$('#pw').value||0;S.draw=+$('#pd').value||0;toast('Saved');save()}};
const SEL={mu(v){localStorage.setItem('ogtmu',v.trim());return 1},mk(v){localStorage.setItem('ogtmk',v.trim());return 1},dom(v){S.domain=v.trim().toLowerCase();save();return 1},lu(v,e){const g={...(L[ct]||{}),[e.dataset.id]:v};L[ct]=g;setDoc(doc(fdb,'lineups',ct),{games:g}).then(()=>toast('Saved')).catch(()=>toast('Could not save'));return 1},cem(v,e){const m={...CM},k=v.trim().toLowerCase();if(k)m[e.dataset.id]=k;else delete m[e.dataset.id];CM=m;setDoc(doc(fdb,'tournament','captains'),{byTeam:m}).then(()=>toast('Captain login saved')).catch(()=>toast('Could not save'));return 1},fg(v){fg=v},sd(v){S.start=v;save();return 1},ed(v){S.end=v;save();return 1},tm(v){S.times=v;save();return 1},off(v){S.off=v;save();return 1},par(v){S.par=Math.max(1,+v||1);save();return 1},tb(v,e){S.tb=S.tb||{};S.tb[e.dataset.id]=+v||0;save();return 1},koon(v,e){S.koOn=e.checked;save();return 1},form(v){S.formUrl=v.trim();save();return 1},g(v){gsel=v},t(v){tsel=v},legs(v){S.legs=+v;save();return 1},
 tname(v,e){S.teams.find(t=>t.id===e.dataset.id).name=v.trim()||'Team';save();return 1},
 cap(v,e){S.teams.find(t=>t.id===e.dataset.id).cap=v;save();return 1},
